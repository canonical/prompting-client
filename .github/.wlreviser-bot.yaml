weblate:
  api_url: https://hosted.weblate.org/api/
  project: ubuntu-desktop-translations

github:
  repository: canonical/prompting-client

ai:
  api_url: https://openrouter.ai/api/v1
  model: google/gemini-3.8-flash

components:
  - weblate_component: prompting-client
    source_locale: en
    context_locales: [de, fr, es]
    format: arb
    source_file: flutter/apps/prompting_client_ui/lib/l10n/app_en.arb
    path: flutter/apps/prompting_client_ui/lib/l10n/app_{locale}.arb
    push_after_commit: false
