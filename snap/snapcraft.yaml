name: prompting-client
base: core24
version: git
title: Prompting Client
summary: Prompting Client
description: The prompting user interface for snap apparmor prompting
source-code: https://github.com/canonical/prompting-client.git
issues: https://github.com/canonical/prompting-client/issues
license: GPL-3.0
grade: stable
confinement: strict
icon: snap/gui/prompting-client.png

apps:
  scripted:
    command: bin/prompting-client-scripted
    extensions: [gnome]
    environment: &env
      PROMPTING_CLIENT_SOCKET: "${XDG_RUNTIME_DIR}/prompting.sock"
      TOKIO_WORKER_THREADS: "2"
    plugs: &plugs
      - home
      - camera
      - audio-playback
      - audio-record
      - snap-interfaces-requests-control

  echo:
    command: bin/prompting-client-echo
    extensions: [gnome]
    environment: *env
    plugs: *plugs

  daemon:
    command: bin/prompting-client-daemon
    extensions: [gnome]
    environment: *env
    plugs: *plugs
    daemon: simple
    success-exit-status: [8]
    passthrough: # TODO: Remove once daemon-scope lands in snapcraft
      daemon-scope: user
    restart-condition: on-failure
    restart-delay: 1s

  # Doesn't need access to home or snapd
  logging-level:
    command: bin/prompting-client-set-log-level
    extensions: [gnome]
    environment: *env

plugs:
  snap-interfaces-requests-control:
    handler-service: daemon

parts:
  fvm:
    plugin: nil
    source: scripts/fvm
    override-build: |
      bash $CRAFT_PART_SRC/install.sh
    build-packages:
      - clang
      - cmake
      - curl
      - git
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - zip
    override-prime: ""

  rust-deps:
    plugin: nil
    build-snaps:
      - rustup
    build-environment:
      - PATH: /snap/bin:$PATH
    override-build: |
      set -eux
      env -u LD_LIBRARY_PATH rustup toolchain install stable --profile minimal
      toolchain="$(env -u LD_LIBRARY_PATH rustup toolchain list | awk 'NR == 1 {print $1}')"
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib/rust"
      cp -a "$HOME/.rustup/toolchains/$toolchain/." "$CRAFT_PART_INSTALL/usr/lib/rust/"

  prompting-client:
    after: [rust-deps]
    plugin: rust
    rust-channel: none
    source: .
    source-type: git
    source-subdir: prompting-client
    override-build: |
      set -e
      mkdir -p $(dirname $CRAFT_PART_SRC)/protos
      cp $CRAFT_PROJECT_DIR/protos/* $(dirname $CRAFT_PART_SRC)/protos/
      craftctl default
    build-environment:
      - PATH: $CRAFT_STAGE/usr/lib/rust/bin:$PATH
    build-packages:
      - libssl-dev
      - pkg-config
      - protobuf-compiler
      - libprotobuf-dev

  prompting-client-ui:
    after: [fvm]
    source: .
    source-type: git
    plugin: nil
    override-build: |
      set -eux
      fvm install
      fvm dart pub global activate melos
      fvm dart pub global run melos clean
      fvm dart pub global run melos bootstrap
      fvm dart pub global run melos generate

      cd flutter/apps/prompting_client_ui
      fvm flutter build linux --release -v
      mkdir -p $CRAFT_PART_INSTALL/bin/
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
    stage-packages:
      - to arm64:
          - fonts-noto-cjk
